<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locale — Driver Training: A Route, Start to Finish</title>
<style>
  :root{
    --bg:#F4F1E8;
    --paper:#FBFAF6;
    --ink:#1B2E24;
    --green-900:#1B3B2C;
    --green-700:#2F6B4F;
    --green-500:#4C9A72;
    --green-300:#8FC3A3;
    --sage:#CFE0D2;
    --sage-2:#E3EDE2;
    --khaki:#C9A46C;
    --red:#C4553F;
    --amber:#E0A33E;
    --teal:#3E8E9C;
    --font-display:"Futura","Avenir Next Condensed","Century Gothic","Trebuchet MS",sans-serif;
    --font-body:"Avenir Next","Avenir","Segoe UI",sans-serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(120% 90% at 50% 0%, #23402F 0%, #16261C 55%, #101A14 100%);
    display:grid;place-items:center;
    font-family:var(--font-body);
    color:var(--ink);
    overflow:hidden;
  }

  /* ---------- Stage: fixed 16:9, everything scales with it ---------- */
  .stage{
    position:relative;
    width:min(100vw, calc(100vh * 16 / 9));
    aspect-ratio:16/9;
    background:var(--bg);
    overflow:hidden;
    container-type:size;
    box-shadow:0 40px 90px rgba(0,0,0,.45);
    cursor:default;
  }
  .canvas{position:absolute;inset:0;width:100%;height:100%;display:block;font-family:var(--font-display)}
  .canvas text{font-family:var(--font-display)}

  .scene{opacity:0;visibility:hidden;transition:opacity .5s ease}
  .scene.is-active{opacity:1;visibility:visible}

  /* ---------- Caption bar ---------- */
  .capbar{
    position:absolute;left:0;right:0;bottom:0;
    min-height:15cqh;
    background:linear-gradient(180deg,#22503A 0%,#1B3B2C 100%);
    display:flex;align-items:center;gap:2.4cqw;
    padding:1.6cqh 5cqw;
    transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s ease;
  }
  .capbar.is-hidden{transform:translateY(101%);opacity:0}
  .step{
    flex:0 0 auto;
    font-family:var(--font-display);
    font-size:1.05cqw;letter-spacing:.22em;font-weight:700;
    color:var(--green-300);
    border:1.5px solid rgba(143,195,163,.42);
    border-radius:100px;
    padding:.75cqh 1.3cqw;
    white-space:nowrap;
  }
  .caption{
    font-size:2.05cqw;line-height:1.4;font-weight:600;
    color:#F4F1E8;letter-spacing:.002em;
  }
  .caption b{color:#A8D8BC;font-weight:700}

  /* ---------- Progress dots ---------- */
  .dots{
    position:absolute;left:0;right:0;bottom:17.2cqh;
    display:flex;justify-content:center;gap:1.1cqw;
  }
  .dot{
    width:.72cqw;height:.72cqw;border-radius:50%;
    background:rgba(27,59,44,.2);
    border:0;padding:0;cursor:pointer;
    transition:transform .3s cubic-bezier(.2,1.5,.3,1),background .3s ease;
  }
  .dot:hover{background:rgba(27,59,44,.42)}
  .dot.is-done{background:rgba(47,107,79,.5)}
  .dot.is-on{background:var(--green-700);transform:scale(1.75)}

  /* ---------- Controls (auto-hide during playback) ---------- */
  .controls{
    position:absolute;top:3cqh;right:2.4cqw;
    display:flex;gap:.8cqw;
    opacity:1;transition:opacity .4s ease;
  }
  .stage.is-idle .controls{opacity:0}
  .btn{
    font-family:var(--font-display);
    font-size:1.02cqw;letter-spacing:.14em;font-weight:700;
    color:var(--green-900);
    background:rgba(251,250,246,.9);
    border:1.5px solid rgba(27,59,44,.16);
    border-radius:100px;
    padding:1cqh 1.5cqw;
    cursor:pointer;
    display:flex;align-items:center;gap:.5cqw;
    transition:background .25s ease,transform .25s ease;
  }
  .btn:hover{background:#fff;transform:translateY(-1px)}
  .btn svg{width:1.15cqw;height:1.15cqw;display:block}

  /* ---------- Start gate: browsers won't autoplay sound without a click ---------- */
  .gate{
    position:absolute;inset:0;
    background:linear-gradient(180deg,#22503A 0%,#16261C 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqh;
    cursor:pointer;z-index:5;
    transition:opacity .5s ease,visibility .5s ease;
  }
  .gate.is-gone{opacity:0;visibility:hidden}
  .gate-mark{
    width:9cqw;height:9cqw;border-radius:2.2cqw;
    background:#F4F1E8;color:#1B3B2C;
    font-family:var(--font-display);font-size:5.6cqw;font-weight:800;
    display:grid;place-items:center;
  }
  .gate-title{
    font-family:var(--font-display);
    font-size:2.9cqw;font-weight:800;color:#F4F1E8;margin:0;text-align:center;
  }
  .gate-sub{font-size:1.35cqw;font-weight:600;color:#8FC3A3;margin:0;letter-spacing:.16em}
  .gate-play{
    display:flex;align-items:center;gap:1cqw;
    font-family:var(--font-display);font-size:1.35cqw;font-weight:800;letter-spacing:.18em;
    color:#1B3B2C;background:#8FC3A3;border:0;border-radius:100px;
    padding:1.7cqh 2.6cqw;cursor:pointer;
    transition:transform .25s ease,background .25s ease;
  }
  .gate-play:hover{background:#A8D8BC;transform:translateY(-2px)}
  .gate-play svg{width:1.5cqw;height:1.5cqw;display:block}

  /* =================================================================
     ANIMATION UTILITIES  — all scoped to .is-active so they replay
     every time a scene is entered, and never run while off-screen.
     ================================================================= */
  .scene.is-active .fade{animation:fade .65s ease var(--d,0s) both}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .scene.is-active .rise{animation:rise .8s cubic-bezier(.2,.85,.2,1) var(--d,0s) both}
  @keyframes rise{from{opacity:0;transform:translateY(38px)}to{opacity:1;transform:none}}

  .scene.is-active .pop{animation:pop .6s cubic-bezier(.2,1.5,.35,1) var(--d,0s) both}
  @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

  .scene.is-active .inL{animation:inL 1s cubic-bezier(.2,.85,.2,1) var(--d,0s) both}
  @keyframes inL{from{opacity:0;transform:translateX(-110px)}to{opacity:1;transform:none}}

  .scene.is-active .inR{animation:inR 1s cubic-bezier(.2,.85,.2,1) var(--d,0s) both}
  @keyframes inR{from{opacity:0;transform:translateX(110px)}to{opacity:1;transform:none}}

  .pop,.wheel,.pulse,.wobble,.tie-l,.tie-r,.jar-fly{transform-box:fill-box;transform-origin:center}

  /* phase beats inside a multi-part scene */
  .scene.is-active .ph{
    animation:phIn .5s ease var(--in,0s) both,
              phOut .5s ease var(--out,9999s) forwards;
  }
  @keyframes phIn{from{opacity:0}to{opacity:1}}
  @keyframes phOut{from{opacity:1}to{opacity:0}}

  /* walking, doors, wheels, misc */
  .scene.is-active .walk{animation:walk 1.9s cubic-bezier(.25,.7,.3,1) var(--d,.2s) both}
  @keyframes walk{from{transform:translateX(-460px)}to{transform:translateX(0)}}

  .scene.is-active .bob{animation:bob .52s ease-in-out var(--d,.2s) 4}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  .scene.is-active .door{animation:door 1.4s cubic-bezier(.4,.05,.2,1) .55s both}
  @keyframes door{from{transform:translateY(0)}to{transform:translateY(-396px)}}

  .scene.is-active .rackroll{animation:rackroll 1.9s cubic-bezier(.2,.8,.25,1) .25s both}
  @keyframes rackroll{from{transform:translateX(790px)}to{transform:translateX(0)}}

  .scene.is-active .wheel{animation:spin 1.1s linear var(--d,0s) infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .scene.is-active .drive{animation:drive 2.5s cubic-bezier(.15,.75,.25,1) .3s both}
  @keyframes drive{from{transform:translateX(-620px)}to{transform:translateX(0)}}

  .scene.is-active .dashmove{animation:dashmove .55s linear infinite}
  @keyframes dashmove{to{transform:translateX(-170px)}}

  .scene.is-active .pulse{animation:pulse 1.7s ease-in-out var(--d,0s) infinite}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.045)}}

  .scene.is-active .wobble{animation:wobble 1.5s ease-in-out var(--d,0s) infinite}
  @keyframes wobble{
    0%,100%{transform:translateX(0) rotate(0deg)}
    30%{transform:translateX(11px) rotate(2.6deg)}
    65%{transform:translateX(-8px) rotate(-2deg)}
  }

  .scene.is-active .scan{animation:scan 3s cubic-bezier(.4,0,.5,1) var(--d,0s) both}
  @keyframes scan{
    0%{transform:translateX(0);opacity:0}
    12%{opacity:1}
    38%{transform:translateX(324px)}
    64%{transform:translateX(162px)}
    88%,100%{transform:translateX(0);opacity:0}
  }

  .scene.is-active .flash{animation:flash .85s ease-out var(--d,0s) both}
  @keyframes flash{0%{opacity:0}14%{opacity:.92}100%{opacity:0}}

  .scene.is-active .snip{animation:snip 1.5s cubic-bezier(.3,.8,.3,1) var(--d,0s) both}
  @keyframes snip{
    from{transform:translate(150px,-96px);opacity:0}
    35%{transform:translate(0,0);opacity:1}
    70%{transform:translate(0,0);opacity:1}
    to{transform:translate(52px,-58px);opacity:0}
  }
  .scene.is-active .tie-l{animation:tieL .7s cubic-bezier(.3,1.2,.4,1) var(--d,0s) both}
  @keyframes tieL{0%,45%{transform:none;opacity:1}to{transform:translate(-46px,26px) rotate(-32deg);opacity:0}}
  .scene.is-active .tie-r{animation:tieR .7s cubic-bezier(.3,1.2,.4,1) var(--d,0s) both}
  @keyframes tieR{0%,45%{transform:none;opacity:1}to{transform:translate(46px,26px) rotate(32deg);opacity:0}}

  .scene.is-active .jar-fly{animation:jarFly 1.15s cubic-bezier(.4,-.3,.4,1) var(--d,0s) both}
  @keyframes jarFly{
    0%{transform:translate(0,0) rotate(0deg);opacity:1}
    100%{transform:translate(var(--fx,300px),var(--fy,-120px)) rotate(28deg);opacity:0}
  }

  .scene.is-active .handoff{animation:handoff 1.5s cubic-bezier(.3,.8,.3,1) var(--d,0s) both}
  @keyframes handoff{from{transform:translateX(0)}to{transform:translateX(126px)}}

  .stage.is-paused .scene *{animation-play-state:paused!important}

  @media (prefers-reduced-motion:reduce){
    .scene.is-active *{animation-duration:.01ms!important;animation-iteration-count:1!important}
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <svg class="canvas" viewBox="0 0 1600 900" role="img" aria-label="Locale driver training animation">

    <!-- ================= REUSABLE DEFINITIONS ================= -->
    <defs>
      <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
        <circle cx="2.5" cy="2.5" r="1.7" fill="#DCE6D8"/>
      </pattern>
      <pattern id="gridDark" width="30" height="30" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.8" fill="rgba(143,195,163,.13)"/>
      </pattern>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#1B3B2C" flood-opacity=".15"/>
      </filter>
      <filter id="softsm" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1B3B2C" flood-opacity=".16"/>
      </filter>

      <!-- ---------- BRIAN: base body (origin at feet, grows upward) ---------- -->
      <g id="brian-base">
        <ellipse cx="0" cy="4" rx="46" ry="8" fill="#1B3B2C" opacity=".1"/>
        <!-- cargo joggers -->
        <rect x="-34" y="-154" width="68" height="62" rx="11" fill="#C9A46C"/>
        <rect x="-31" y="-106" width="27" height="94" rx="10" fill="#C9A46C"/>
        <rect x="4" y="-106" width="27" height="94" rx="10" fill="#C9A46C"/>
        <path d="M-31,-106 h27 v10 h-27 z" fill="#BC9760" opacity=".55"/>
        <path d="M4,-106 h27 v10 h-27 z" fill="#BC9760" opacity=".55"/>
        <!-- thigh cargo pocket + label patch -->
        <rect x="6" y="-132" width="23" height="27" rx="4" fill="#BE9760"/>
        <rect x="10" y="-128" width="15" height="6" rx="2" fill="#A8854F"/>
        <rect x="-30" y="-129" width="8" height="20" rx="3" fill="#BE9760" opacity=".8"/>
        <!-- jogger cuffs -->
        <rect x="-31" y="-26" width="27" height="12" rx="5" fill="#B8925A"/>
        <rect x="4" y="-26" width="27" height="12" rx="5" fill="#B8925A"/>
        <!-- sneakers -->
        <path d="M-32,-16 h28 v10 q0,6 -6,6 h-22 q-5,0 -5,-5 z" fill="#2A2A2A"/>
        <path d="M4,-16 h28 v11 q0,5 -5,5 h-23 q-6,0 -6,-6 z" fill="#2A2A2A"/>
        <rect x="-33" y="-5" width="29" height="5" rx="2.5" fill="#EFEDE6"/>
        <rect x="4" y="-5" width="29" height="5" rx="2.5" fill="#EFEDE6"/>
        <rect x="-27" y="-12" width="9" height="2.4" rx="1.2" fill="#F4F1E8" opacity=".85"/>
        <rect x="12" y="-12" width="9" height="2.4" rx="1.2" fill="#F4F1E8" opacity=".85"/>
        <!-- oversized tee -->
        <rect x="-45" y="-242" width="90" height="94" rx="13" fill="#F2F0EA"/>
        <rect x="-59" y="-238" width="19" height="46" rx="9.5" fill="#F2F0EA"/>
        <rect x="40" y="-238" width="19" height="46" rx="9.5" fill="#F2F0EA"/>
        <path d="M-45,-160 h90 v12 q0,4 -6,4 h-78 q-6,0 -6,-4 z" fill="#E6E3DA"/>
        <!-- grayscale photo graphic + small cross -->
        <rect x="-18" y="-226" width="36" height="50" rx="2" fill="#4F4F4F"/>
        <rect x="-14" y="-214" width="28" height="27" fill="#727272"/>
        <rect x="-9" y="-200" width="18" height="13" fill="#565656"/>
        <rect x="-1" y="-223" width="2" height="11" fill="#D8D8D8"/>
        <rect x="-4.5" y="-219" width="9" height="2" fill="#D8D8D8"/>
        <rect x="-14" y="-184" width="28" height="4" fill="#8C8C8C"/>
        <!-- neck + head -->
        <rect x="-10" y="-254" width="20" height="17" rx="4" fill="#D9A17C"/>
        <rect x="-25" y="-302" width="50" height="58" rx="21" fill="#E9BC94"/>
        <!-- beard -->
        <path d="M-25,-272 q0,28 25,28 q25,0 25,-28 q-8,9 -25,9 q-17,0 -25,-9 z" fill="#BE9152"/>
        <rect x="-8" y="-274" width="16" height="4" rx="2" fill="#B0853F"/>
        <!-- hair + top knot -->
        <path d="M-25,-284 q3,-19 25,-19 q22,0 25,19 q-10,-9 -25,-9 q-15,0 -25,9 z" fill="#C79A5B"/>
        <path d="M-25,-284 q-2,10 0,16 q-4,-8 0,-16 z" fill="#B98C4E"/>
        <circle cx="0" cy="-309" r="11.5" fill="#C79A5B"/>
        <circle cx="-3" cy="-311" r="4" fill="#B98C4E" opacity=".6"/>
        <!-- friendly eyes -->
        <circle cx="-9" cy="-278" r="2.7" fill="#3A2E22"/>
        <circle cx="9" cy="-278" r="2.7" fill="#3A2E22"/>
      </g>

      <!-- Brian poses: base + arm variants -->
      <g id="brian-idle">
        <use href="#brian-base"/>
        <rect x="-57" y="-198" width="15.5" height="50" rx="7.75" fill="#E9BC94"/>
        <rect x="41.5" y="-198" width="15.5" height="50" rx="7.75" fill="#E9BC94"/>
      </g>

      <g id="brian-phone">
        <use href="#brian-base"/>
        <rect x="-57" y="-198" width="15.5" height="50" rx="7.75" fill="#E9BC94"/>
        <rect x="30" y="-202" width="15.5" height="46" rx="7.75" fill="#E9BC94"
              transform="rotate(-44 37.75 -179)"/>
        <g filter="url(#softsm)">
          <rect x="4" y="-218" width="28" height="45" rx="5" fill="#2E3B34"/>
          <rect x="7" y="-214" width="22" height="37" rx="3" fill="#8FC3A3"/>
        </g>
      </g>

      <g id="brian-point">
        <use href="#brian-base"/>
        <rect x="-57" y="-198" width="15.5" height="50" rx="7.75" fill="#E9BC94"/>
        <rect x="41.5" y="-210" width="50" height="15.5" rx="7.75" fill="#E9BC94"/>
      </g>

      <g id="brian-carry">
        <use href="#brian-base"/>
        <rect x="-58" y="-200" width="15.5" height="44" rx="7.75" fill="#E9BC94"
              transform="rotate(30 -50.25 -192)"/>
        <rect x="42" y="-200" width="15.5" height="44" rx="7.75" fill="#E9BC94"
              transform="rotate(-30 49.75 -192)"/>
      </g>

      <!-- ---------- Dispatcher ---------- -->
      <g id="dispatch">
        <ellipse cx="0" cy="4" rx="42" ry="7.5" fill="#1B3B2C" opacity=".1"/>
        <rect x="-30" y="-148" width="60" height="58" rx="10" fill="#2E3B34"/>
        <rect x="-28" y="-102" width="25" height="90" rx="9" fill="#2E3B34"/>
        <rect x="3" y="-102" width="25" height="90" rx="9" fill="#2E3B34"/>
        <path d="M-30,-14 h27 v9 q0,5 -6,5 h-21 q-4,0 -4,-4 z" fill="#232323"/>
        <path d="M3,-14 h27 v9 q0,5 -5,5 h-22 q-5,0 -5,-5 z" fill="#232323"/>
        <rect x="-41" y="-232" width="82" height="88" rx="12" fill="#2F6B4F"/>
        <rect x="-54" y="-228" width="17" height="42" rx="8.5" fill="#2F6B4F"/>
        <rect x="38" y="-228" width="17" height="42" rx="8.5" fill="#2F6B4F"/>
        <path d="M-11,-232 h22 v13 q-11,7 -22,0 z" fill="#285B44"/>
        <rect x="-52" y="-192" width="14.5" height="46" rx="7.25" fill="#B4805A"/>
        <rect x="37.5" y="-192" width="14.5" height="46" rx="7.25" fill="#B4805A"/>
        <rect x="-9" y="-244" width="18" height="16" rx="4" fill="#A57250"/>
        <rect x="-24" y="-290" width="48" height="54" rx="20" fill="#C68E63"/>
        <path d="M-24,-268 q0,-24 24,-24 q24,0 24,24 q-24,-9 -48,0 z" fill="#1B3B2C"/>
        <path d="M-24,-268 h52 q4,0 4,4 h-56 z" fill="#153024"/>
        <circle cx="-8.5" cy="-262" r="2.6" fill="#3A2E22"/>
        <circle cx="8.5" cy="-262" r="2.6" fill="#3A2E22"/>
      </g>

      <!-- ---------- Customer ---------- -->
      <g id="customer">
        <ellipse cx="0" cy="4" rx="38" ry="7" fill="#1B3B2C" opacity=".1"/>
        <rect x="-27" y="-140" width="54" height="54" rx="9" fill="#5D6B75"/>
        <rect x="-25" y="-96" width="22" height="84" rx="8" fill="#5D6B75"/>
        <rect x="3" y="-96" width="22" height="84" rx="8" fill="#5D6B75"/>
        <path d="M-27,-14 h24 v9 q0,5 -5,5 h-19 q-4,0 -4,-4 z" fill="#3B3B3B"/>
        <path d="M3,-14 h24 v9 q0,5 -5,5 h-19 q-4,0 -4,-4 z" fill="#3B3B3B"/>
        <rect x="-36" y="-222" width="72" height="84" rx="11" fill="#9B7A8C"/>
        <rect x="-48" y="-218" width="15" height="40" rx="7.5" fill="#9B7A8C"/>
        <rect x="34" y="-218" width="15" height="40" rx="7.5" fill="#9B7A8C"/>
        <rect x="-50" y="-190" width="14" height="42" rx="7" fill="#E0B79A"
              transform="rotate(26 -43 -169)"/>
        <rect x="36" y="-190" width="14" height="42" rx="7" fill="#E0B79A"
              transform="rotate(-26 43 -169)"/>
        <rect x="-8" y="-234" width="16" height="15" rx="4" fill="#CFA487"/>
        <rect x="-23" y="-280" width="46" height="52" rx="19" fill="#E0B79A"/>
        <path d="M-25,-256 q-2,-30 25,-30 q27,0 25,30 q0,-14 -25,-14 q-25,0 -25,14 z" fill="#4A3B33"/>
        <circle cx="-8" cy="-254" r="2.5" fill="#3A2E22"/>
        <circle cx="8" cy="-254" r="2.5" fill="#3A2E22"/>
      </g>

      <!-- ---------- Insulated bag (74 x 86, origin top-left) ---------- -->
      <g id="bag">
        <rect x="0" y="0" width="74" height="86" rx="9" fill="#7FA98C"/>
        <rect x="0" y="0" width="74" height="23" rx="9" fill="#5F8E73"/>
        <path d="M27,-9 h20 a7,7 0 0 1 0,14 h-20 a7,7 0 0 1 0,-14 z" fill="none" stroke="#4C7A60" stroke-width="5"/>
        <rect x="9" y="33" width="56" height="36" rx="4" fill="#FBFAF6"/>
        <rect x="14" y="40" width="22" height="5" rx="2.5" fill="#BCCCC0"/>
        <rect x="14" y="50" width="32" height="5" rx="2.5" fill="#BCCCC0"/>
        <rect x="14" y="59" width="18" height="4" rx="2" fill="#D3DED6"/>
        <rect x="45" y="38" width="16" height="9" rx="3" fill="#3E8E9C"/>
        <rect x="0" y="76" width="74" height="10" rx="5" fill="#6E997C"/>
      </g>

      <!-- ---------- Empty jar ---------- -->
      <g id="jar">
        <rect x="0" y="6" width="26" height="34" rx="6" fill="#DCE9DE" opacity=".92"/>
        <rect x="3" y="0" width="20" height="9" rx="3" fill="#2F6B4F"/>
        <rect x="5" y="14" width="5" height="18" rx="2.5" fill="#FBFAF6" opacity=".75"/>
      </g>

<script>
(function(){
  "use strict";
  const NS = "http://www.w3.org/2000/svg";

  /* Replaced by `python3 narration.py embed` with an inline base64 audio map. */
  /*__AUDIO_MANIFEST__*/

  /* ---------------------------------------------------------------
     THE ONE REUSABLE BAG LABEL COMPONENT
     Bottom-left  = route + stop  (which bag, and the drop-off order)
     Top-right    = DSP name on the week colour
     Rendered into every <g class="label-slot">, drawn in a 200x130 box
     so callers can place and scale it however they like.
     --------------------------------------------------------------- */
  const WEEK_COLORS = {
    teal:  { fill:"#3E8E9C", ink:"#FBFAF6", week:"WEEK 32" },
    amber: { fill:"#E0A33E", ink:"#3B2A0C", week:"WEEK 31" },
    plum:  { fill:"#8E6FB0", ink:"#FBFAF6", week:"WEEK 33" },
    coral: { fill:"#D2694E", ink:"#FBFAF6", week:"WEEK 34" }
  };

  function labelMarkup(o){
    const wk = WEEK_COLORS[o.week] || WEEK_COLORS.teal;
    return `
      <rect width="200" height="130" rx="10" fill="#FBFAF6" stroke="#CFE0D2" stroke-width="2"/>

      <text x="13" y="31" font-size="11" font-weight="800" fill="#7C8C81" letter-spacing="1.5">DSP</text>
      <rect x="82" y="12" width="104" height="30" rx="8" fill="${wk.fill}"/>
      <text x="134" y="32" font-size="13" font-weight="800" fill="${wk.ink}"
            text-anchor="middle" letter-spacing=".5">${o.dsp}</text>
      <text x="134" y="52" font-size="8" font-weight="800" fill="#9AA8A0"
            text-anchor="middle" letter-spacing="1.2">${wk.week}</text>

      <line x1="13" y1="60" x2="187" y2="60" stroke="#E3EDE2" stroke-width="2"/>

      <text x="13" y="80" font-size="9.5" font-weight="800" fill="#7C8C81" letter-spacing="1.4">ROUTE</text>
      <text x="13" y="112" font-size="29" font-weight="800" fill="#1B3B2C">${o.route}</text>
      <text x="74" y="80" font-size="9.5" font-weight="800" fill="#7C8C81" letter-spacing="1.4">STOP</text>
      <text x="74" y="112" font-size="29" font-weight="800" fill="#1B3B2C">${o.stop}</text>

      <g fill="#1B3B2C" opacity=".8">
        <rect x="140" y="84" width="3" height="28"/><rect x="146" y="84" width="1.6" height="28"/>
        <rect x="151" y="84" width="3.4" height="28"/><rect x="158" y="84" width="1.6" height="28"/>
        <rect x="163" y="84" width="2.4" height="28"/><rect x="169" y="84" width="3.4" height="28"/>
        <rect x="176" y="84" width="1.6" height="28"/><rect x="181" y="84" width="3" height="28"/>
      </g>`;
  }

  document.querySelectorAll(".label-slot").forEach(function(slot){
    slot.innerHTML = labelMarkup({
      route: slot.dataset.route,
      stop:  slot.dataset.stop,
      dsp:   slot.dataset.dsp,
      week:  slot.dataset.week
    });
  });

  /* ---------------------------------------------------------------
     Rolling rack: 4 shelves x 5 insulated bags = 20, plus the
     staggered verification checkmarks used in scene 4.
     --------------------------------------------------------------- */
  const SHELVES = [120, 232, 344, 456];
  const COLS = [14, 96, 178, 260, 342];
  const BAG_SCALE = 0.6;
  const CHECK_START = 0.75;
  const CHECK_STEP = 0.2;

  function el(name, attrs){
    const node = document.createElementNS(NS, name);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  }

  function buildRack(slot){
    const withChecks = slot.dataset.checks === "1";
    const frag = document.createDocumentFragment();

    // frame
    frag.appendChild(el("rect", {x:0, y:46, width:430, height:11, rx:5.5, fill:"#2F6B4F"}));
    frag.appendChild(el("rect", {x:0, y:56, width:13, height:424, rx:6, fill:"#2F6B4F"}));
    frag.appendChild(el("rect", {x:417, y:56, width:13, height:424, rx:6, fill:"#2F6B4F"}));

    // shelves + bags
    let n = 0;
    SHELVES.forEach(function(shelfY, row){
      COLS.forEach(function(x){
        const g = el("g", {transform:"translate(" + x + "," + (shelfY - 86 * BAG_SCALE) + ")"});
        g.appendChild(el("use", {href:"#bag", transform:"scale(" + BAG_SCALE + ")"}));
        frag.appendChild(g);
        n++;
      });
      frag.appendChild(el("rect", {x:0, y:shelfY, width:430, height:11, rx:4, fill:"#DCE6D8"}));
      frag.appendChild(el("rect", {x:0, y:shelfY + 11, width:430, height:4, fill:"#C2D2C4"}));
    });

    // casters
    [40, 150, 280, 390].forEach(function(cx){
      frag.appendChild(el("circle", {cx:cx, cy:492, r:12, fill:"#3A4A40"}));
      frag.appendChild(el("circle", {cx:cx, cy:492, r:5, fill:"#8FA593"}));
    });

    // verification checkmarks
    if (withChecks){
      let i = 0;
      SHELVES.forEach(function(shelfY){
        COLS.forEach(function(x){
          const cx = x + 74 * BAG_SCALE / 2;
          const cy = shelfY - 86 * BAG_SCALE / 2;
          // Position on an outer <g>; the animated <g> must stay free of a
          // transform attribute, or the CSS scale would wipe out the offset.
          const holder = el("g", {transform:"translate(" + cx + "," + cy + ")"});
          const g = el("g", {
            class:"pop",
            style:"--d:" + (CHECK_START + i * CHECK_STEP).toFixed(2) + "s"
          });
          g.appendChild(el("circle", {r:16, fill:"#4C9A72", stroke:"#FBFAF6", "stroke-width":3}));
          g.appendChild(el("path", {
            d:"M-7,0 l5,6 l9,-11",
            stroke:"#FBFAF6", "stroke-width":3.6, fill:"none",
            "stroke-linecap":"round", "stroke-linejoin":"round"
          }));
          holder.appendChild(g);
          frag.appendChild(holder);
          i++;
        });
      });
    }
    slot.appendChild(frag);
  }

  document.querySelectorAll(".rack-slot").forEach(buildRack);

  /* ---------------------------------------------------------------
     Scene timeline
     --------------------------------------------------------------- */
  const SCENES = [
    { id:"s1", dur: 8200, cap:"Your DSP assigns you a route number. You'll need it at the warehouse." },
    { id:"s2", dur: 9200, cap:"At the warehouse, show dispatch the code on your phone and give them your route number." },
    { id:"s3", dur: 8000, cap:"Dispatch brings out your rack — about 20 insulated bags across 4 shelves." },
    { id:"s4", dur: 9200, cap:"Check every bag before you leave. Confirm nothing is missing." },
    { id:"s5", dur:11000, cap:"Tell dispatch you're leaving. Load bags flat and secured — don't stack orders on top of each other or let them slide around." },
    { id:"s6", dur:10000, cap:"Bottom-left of the label = route + stop number. That tells you which bag goes where." },
    { id:"s7", dur:13000, cap:"Match the route + stop. If it's a multi-bag order, remove the zip tie before you take it." },
    { id:"s8", dur:14500, cap:"Deliver, take the photo, then collect empty jars and bags for return. Use the week color (top-right of the label) so returns never get mixed up with this week's orders." },
    { id:"s9", dur: 7000, cap:"" }
  ];
  const TOTAL_STEPS = SCENES.length - 1;

  /* ---------------------------------------------------------------
     Voiceover. Each scene has an optional clip; when one exists the
     scene stretches to fit it, so re-recording the script re-times
     the animation. With no audio/ folder the authored timings above
     are used and the file still plays through silently.
     --------------------------------------------------------------- */
  const TAIL_MS = 900;              // beat of silence after a line lands
  const MANIFEST = (typeof window.__AUDIO__ === "object" && window.__AUDIO__) || null;
  const clips = {};
  const clipSecs = {};
  let hasAudio = false;

  function clipSrc(id){
    return MANIFEST ? MANIFEST[id] : "audio/" + id + ".mp3";
  }

  function loadAudio(done){
    let pending = 0, found = 0, settled = false;

    function finish(){
      if (settled) return;
      settled = true;
      done(found);
    }

    SCENES.forEach(function(s){
      const src = clipSrc(s.id);
      if (!src) return;
      const audio = new Audio();
      audio.preload = "auto";
      pending++;
      audio.addEventListener("loadedmetadata", function(){
        if (isFinite(audio.duration) && audio.duration > 0){
          clipSecs[s.id] = audio.duration;
          found++;
        }
        if (--pending === 0) finish();
      });
      audio.addEventListener("error", function(){
        if (--pending === 0) finish();
      });
      audio.src = src;
      clips[s.id] = audio;
    });

    if (pending === 0) finish();
    setTimeout(finish, 5000);       // never hang on a stalled request
  }

  function durationFor(i){
    const s = SCENES[i];
    const secs = clipSecs[s.id];
    return secs ? Math.max(s.dur, secs * 1000 + TAIL_MS) : s.dur;
  }

  function silence(){
    for (const id in clips){
      const a = clips[id];
      a.pause();
      try { a.currentTime = 0; } catch(e){}
    }
  }

  function speak(id){
    const a = clips[id];
    if (!hasAudio || !a) return;
    try { a.currentTime = 0; } catch(e){}
    a.play().catch(function(){});   // a blocked play shouldn't break playback
  }

  const stage    = document.getElementById("stage");
  const capbar   = document.getElementById("capbar");
  const caption  = document.getElementById("caption");
  const stepPill = document.getElementById("step");
  const dotsWrap = document.getElementById("dots");
  const playBtn  = document.getElementById("playBtn");
  const playIcon = document.getElementById("playIcon");
  const playLabel= document.getElementById("playLabel");
  const counter  = document.getElementById("s4count");

  const ICON_PAUSE = "M7 5h4v14H7zM13 5h4v14h-4z";
  const ICON_PLAY  = "M8 5l12 7-12 7z";

  let index = 0;
  let playing = true;
  let timer = null;
  let startedAt = 0;
  let remaining = 0;
  let rafId = null;

  // progress dots
  SCENES.forEach(function(_, i){
    const b = document.createElement("button");
    b.className = "dot";
    b.setAttribute("aria-label", "Go to scene " + (i + 1));
    b.addEventListener("click", function(){ goTo(i); });
    dotsWrap.appendChild(b);
  });
  const dots = Array.prototype.slice.call(dotsWrap.children);

  function paintDots(){
    dots.forEach(function(d, i){
      d.classList.toggle("is-on", i === index);
      d.classList.toggle("is-done", i < index);
    });
  }

  /* Scene 4 counts bags up in step with the checkmarks appearing. */
  function runCounter(){
    if (!counter) return;
    const total = 20;
    const delay = CHECK_START * 1000;
    const span  = (total - 1) * CHECK_STEP * 1000;
    const t0 = performance.now();
    counter.textContent = "0 / " + total;

    (function tick(now){
      if (index !== 3 || !playing){
        if (index === 3) rafId = requestAnimationFrame(tick);
        return;
      }
      const t = now - t0 - delay;
      const shown = Math.max(0, Math.min(total, Math.round(t / span * (total - 1)) + (t >= 0 ? 1 : 0)));
      counter.textContent = shown + " / " + total;
      if (shown < total) rafId = requestAnimationFrame(tick);
    })(t0);
  }

  function show(i){
    index = i;
    const scene = SCENES[i];

    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

    SCENES.forEach(function(s){
      document.getElementById(s.id).classList.toggle("is-active", s.id === scene.id);
    });

    // Restart CSS animations cleanly on re-entry.
    const active = document.getElementById(scene.id);
    void active.getBoundingClientRect();

    caption.textContent = scene.cap;
    const isStep = i < TOTAL_STEPS;
    stepPill.textContent = "STEP " + (i + 1) + " OF " + TOTAL_STEPS;
    stepPill.style.display = isStep ? "" : "none";
    capbar.classList.toggle("is-hidden", scene.cap === "");

    paintDots();
    if (scene.id === "s4") runCounter();

    silence();
    if (playing) speak(scene.id);

    schedule(durationFor(i));
  }

  function schedule(ms){
    clearTimeout(timer);
    remaining = ms;
    if (!playing) return;
    startedAt = performance.now();
    timer = setTimeout(next, ms);
  }

  function next(){
    if (index >= SCENES.length - 1){
      setPlaying(false);           // hold on the closing card
      return;
    }
    show(index + 1);
  }

  function goTo(i){
    show(Math.max(0, Math.min(SCENES.length - 1, i)));
    if (!playing) setPlaying(true);
  }

  function setPlaying(on){
    playing = on;
    stage.classList.toggle("is-paused", !on);
    playIcon.setAttribute("d", on ? ICON_PAUSE : ICON_PLAY);
    playLabel.textContent = on ? "PAUSE" : "PLAY";

    const voice = clips[SCENES[index].id];

    if (on){
      startedAt = performance.now();
      clearTimeout(timer);
      timer = setTimeout(next, remaining);
      if (index === 3) runCounter();
      if (hasAudio && voice) voice.play().catch(function(){});
    } else {
      clearTimeout(timer);
      remaining = Math.max(0, remaining - (performance.now() - startedAt));
      if (voice) voice.pause();
    }
  }

  playBtn.addEventListener("click", function(){ setPlaying(!playing); });
  document.getElementById("replayBtn").addEventListener("click", function(){ goTo(0); });

  document.addEventListener("keydown", function(e){
    // Before the title card is dismissed, any key just starts the show.
    if (!document.getElementById("gate").classList.contains("is-gone")){
      if (e.code === "Space" || e.key === "Enter"){ e.preventDefault(); begin(); }
      return;
    }
    if (e.code === "Space"){ e.preventDefault(); setPlaying(!playing); }
    else if (e.key === "ArrowRight") goTo(index + 1);
    else if (e.key === "ArrowLeft")  goTo(index - 1);
    else if (e.key.toLowerCase() === "r") goTo(0);
  });

  // Hide the chrome while it plays so screen recordings stay clean.
  let idleTimer = null;
  function wake(){
    stage.classList.remove("is-idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ stage.classList.add("is-idle"); }, 2600);
  }
  stage.addEventListener("mousemove", wake);
  wake();

  /* The title card doubles as the click that unlocks audio playback,
     so start your screen recorder first, then press play. */
  const gate = document.getElementById("gate");
  let audioSettled = false;
  let startRequested = false;

  function begin(){
    if (gate.classList.contains("is-gone")) return;
    startRequested = true;
    if (!audioSettled) return;      // wait a beat for clip metadata
    gate.classList.add("is-gone");
    playing = true;
    show(0);
  }

  gate.addEventListener("click", begin);

  loadAudio(function(found){
    hasAudio = found > 0;
    audioSettled = true;
    if (startRequested) begin();
  });
})();
</script>
</body>
</html>
