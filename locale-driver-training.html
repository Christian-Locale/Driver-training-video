<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Driver Training: A Route, Start to Finish</title>
<style>
  :root{
    --bg:#F4F1E8;
    --paper:#FBFAF6;
    --ink:#1B2E24;
    --green-900:#1B3B2C;
    --green-700:#2F6B4F;
    --green-500:#4C9A72;
    --green-300:#8FC3A3;
    --sage:#CFE0D2;
    --sage-2:#E3EDE2;
    --khaki:#C9A46C;
    --red:#C4553F;
    --amber:#E0A33E;
    --teal:#3E8E9C;
    --font-display:"Futura","Avenir Next Condensed","Century Gothic","Trebuchet MS",sans-serif;
    --font-body:"Avenir Next","Avenir","Segoe UI",sans-serif;
  }

  *{box-sizing:border-box}
  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  html,body{margin:0;height:100%;height:100dvh}
  body{
    background:
      radial-gradient(120% 90% at 50% 0%, #23402F 0%, #16261C 55%, #101A14 100%);
    display:grid;place-items:center;
    font-family:var(--font-body);
    color:var(--ink);
    overflow:hidden;
  }

  /* ---------- Stage: fixed 16:9, everything scales with it ---------- */
  .stage{
    position:relative;
    width:min(100%, calc(100dvh * 16 / 9));
    aspect-ratio:16/9;
    background:var(--bg);
    overflow:hidden;
    container-type:size;
    box-shadow:0 40px 90px rgba(0,0,0,.45);
    cursor:default;
  }
  .screen{position:absolute;inset:0}
  .canvas{position:absolute;inset:0;width:100%;height:100%;display:block;font-family:var(--font-display);
    animation:handheld 6.8s ease-in-out infinite}
  .canvas text{font-family:var(--font-display)}
  @keyframes handheld{
    0%,100%{transform:translate(0,0) rotate(0deg)}
    22%{transform:translate(1.4px,-1.1px) rotate(.05deg)}
    48%{transform:translate(-1.2px,1.3px) rotate(-.06deg)}
    74%{transform:translate(.9px,.7px) rotate(.04deg)}
  }

  /* Scene handoff is a whip-cut, not a dissolve. Outgoing frame is
     shoved off-screen (is-leaving) while the incoming frame slams in
     from the opposite side. --pace stretches authored beat delays so
     they land with the voiceover instead of finishing in the first
     8 seconds and then holding like a slide. */
  .scene{
    --pace:1;
    opacity:0;visibility:hidden;
    transform:translateX(-120px) scale(1.03);
    transform-origin:50% 50%;
    transition:opacity .28s ease, transform .34s cubic-bezier(.4,0,.2,1), visibility .28s;
  }
  /* Hidden scenes used to stay in the SVG render tree. A transform on
     .canvas then invalidated all 16 of them every frame. */
  .scene:not(.is-active):not(.is-leaving):not(.is-warm){display:none}
  /* Warm (pre-rendered next) and leaving scenes are invisible but still
     in the render tree, layered over/under the active one. SVG hit-testing
     ignores opacity, so without this a tap on a photo in the active scene
     lands on the same-position photo in the hidden neighbour scene. */
  .scene.is-warm,.scene.is-leaving{pointer-events:none}
  .scene.is-leaving{
    opacity:0;visibility:visible;
    transform:translateX(-140px) scale(1.05);
  }
  .scene.is-active{
    opacity:1;visibility:visible;
    animation:sceneWhip .4s cubic-bezier(.16,.84,.22,1) both;
  }
  @keyframes sceneWhip{
    from{transform:translateX(150px) scale(1.06)}
    to  {transform:none}
  }
  @keyframes sceneFadeIn{
    from{opacity:0}
    to  {opacity:1}
  }
  @keyframes sceneFadeOut{
    from{opacity:1}
    to  {opacity:0}
  }

  /* ---------- Caption bar ---------- */
  .capbar{
    position:absolute;left:0;right:0;bottom:0;z-index:3;
    min-height:14cqh;
    background:linear-gradient(180deg,rgba(27,59,44,0) 0%,#1B3B2C 38%,#15281F 100%);
    display:flex;align-items:flex-end;gap:2cqw;
    /* Leave room on the right so Back / Continue never cover the line. */
    padding:3.2cqh 28cqw 2cqh 4.4cqw;
    transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s ease;
  }
  .capbar.is-hidden{transform:translateY(101%);opacity:0}
  .step{
    flex:0 0 auto;
    font-family:var(--font-display);
    font-size:.92cqw;letter-spacing:.2em;font-weight:700;
    color:var(--green-300);
    opacity:.72;
    padding:0 0 .35cqh;
    white-space:nowrap;
  }
  .caption{
    flex:1 1 auto;min-width:0;
    font-size:1.95cqw;line-height:1.35;font-weight:600;
    color:#F4F1E8;letter-spacing:.002em;
    transform-origin:left bottom;
  }
  .caption.is-in{animation:capIn .55s cubic-bezier(.2,.8,.2,1) both}
  @keyframes capIn{
    from{opacity:0;transform:translateY(14px)}
    to  {opacity:1;transform:none}
  }
  .caption b{color:#A8D8BC;font-weight:700}

  /* Film-style progress — one bar for the whole piece, not slide dots. */
  .filmbar{
    display:none;
    position:absolute;left:0;right:0;top:0;z-index:4;
    height:.55cqh;background:rgba(27,59,44,.18);
    pointer-events:none;
  }
  .filmbar > i{
    display:block;height:100%;width:0;
    background:#4C9A72;
    box-shadow:0 0 10px rgba(76,154,114,.45);
  }
  .cutflash{
    position:absolute;inset:0;z-index:4;pointer-events:none;
    background:#101A14;opacity:0;
  }
  .cutflash.is-on{animation:cutflash .2s ease-out both}
  @keyframes cutflash{0%{opacity:.5}100%{opacity:0}}

  /* Dots stay as a seek control, but drop out of the picture while it plays. */
  .dots{
    position:absolute;left:0;right:0;bottom:16.4cqh;z-index:3;
    display:flex;justify-content:center;gap:1.1cqw;
    opacity:0;transition:opacity .35s ease;
  }
  .stage:not(.is-idle) .dots{opacity:1}
  .dot{
    width:.72cqw;height:.72cqw;border-radius:50%;
    background:rgba(27,59,44,.2);
    border:0;padding:0;cursor:pointer;
    transition:transform .3s cubic-bezier(.2,1.5,.3,1),background .3s ease;
  }
  .dot:hover{background:rgba(27,59,44,.42)}
  .dot.is-done{background:rgba(47,107,79,.5)}
  .dot.is-on{background:var(--green-700);transform:scale(1.75)}

  /* ---------- Controls (auto-hide during playback) ---------- */
  .controls{
    position:absolute;top:3cqh;right:2.4cqw;z-index:3;
    display:flex;gap:.8cqw;
    opacity:1;transition:opacity .4s ease;
  }
  .stage.is-idle .controls{opacity:0}
  .btn{
    font-family:var(--font-display);
    font-size:1.02cqw;letter-spacing:.14em;font-weight:700;
    color:var(--green-900);
    background:rgba(251,250,246,.9);
    border:1.5px solid rgba(27,59,44,.16);
    border-radius:100px;
    padding:1cqh 1.5cqw;
    cursor:pointer;
    display:flex;align-items:center;gap:.5cqw;
    transition:background .25s ease,transform .25s ease,opacity .25s ease;
  }
  .btn:hover:not(:disabled){background:#fff;transform:translateY(-1px)}
  .btn:disabled{opacity:.34;cursor:not-allowed;transform:none}
  .btn svg{width:1.15cqw;height:1.15cqw;display:block}

  /* Back / Continue stay visible — this is how you move through the training. */
  .nav{
    position:absolute;right:2.4cqw;bottom:2.4cqh;z-index:4;
    display:flex;gap:.8cqw;align-items:center;
  }
  .nav-continue{
    background:#2F6B4F;color:#F4F1E8;border-color:transparent;
  }
  .nav-continue:hover:not(:disabled){background:#3A7D5C;color:#fff;transform:translateY(-1px)}
  .nav-continue.is-ready{
    animation:contReady 1.5s ease-in-out infinite;
  }
  @keyframes contReady{
    0%,100%{box-shadow:0 0 0 0 rgba(76,154,114,.0)}
    50%{box-shadow:0 0 0 8px rgba(76,154,114,.22)}
  }
  .dot:disabled{cursor:not-allowed;opacity:.35}
  .dot:disabled:hover{background:rgba(27,59,44,.2);transform:none}

  /* Language picker sits on the opening card. Nav stays above it so
     Start can be the same Continue control used for the rest of the video. */
  .langpick{
    position:absolute;inset:0;z-index:2;
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:22cqh;
    pointer-events:none;
    transition:opacity .4s ease,visibility .4s ease;
  }
  .langpick.is-gone{opacity:0;visibility:hidden;display:none}
  .langpick-row{
    display:flex;gap:1.4cqw;
    pointer-events:auto;
  }
  .lang-btn{
    font-family:var(--font-display);
    font-size:1.45cqw;letter-spacing:.1em;font-weight:800;
    color:#F4F1E8;
    background:rgba(251,250,246,.08);
    border:2px solid rgba(143,195,163,.5);
    border-radius:100px;
    padding:1.7cqh 2.6cqw;
    min-width:17cqw;
    cursor:pointer;
    transition:background .25s ease,transform .25s ease,border-color .25s ease,color .25s ease;
  }
  .lang-btn:hover{background:rgba(251,250,246,.16);transform:translateY(-2px)}
  .lang-btn.is-on{
    background:#8FC3A3;
    color:#1B3B2C;
    border-color:#8FC3A3;
  }
  /* Volume reminder on the intro slide: sound waves pulse beside the speaker. */
  .scene.is-active .vwave{animation:volWave 1.5s ease-in-out calc(var(--d,0s) * var(--pace,1)) infinite}
  .scene.is-active .vwave-2{animation-delay:calc((var(--d,0s) + .25s) * var(--pace,1))}
  @keyframes volWave{0%,100%{opacity:.25}50%{opacity:1}}
  .stage.is-picking .controls,
  .stage.is-picking .dots,
  .stage.is-picking .capbar,
  .stage.is-picking .filmbar{
    opacity:0;visibility:hidden;pointer-events:none;
  }

  /* =================================================================
     ANIMATION UTILITIES  — all scoped to .is-active so they replay
     every time a scene is entered, and never run while off-screen.
     Delays are multiplied by --pace so a longer voice clip stretches
     the story beats instead of leaving a still frame at the end.
     Durations stay real-world (a walk still takes ~2s).
     ================================================================= */
  .scene.is-active .fade{animation:fade .65s ease calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .scene.is-active .fade-out{animation:fadeOut .4s ease calc(var(--d,0s) * var(--pace,1)) forwards}
  @keyframes fadeOut{to{opacity:0}}

  .scene.is-active .star-drop{
    animation:starDrop .85s cubic-bezier(.45,-.35,.55,1) calc(var(--d,0s) * var(--pace,1)) both;
  }
  @keyframes starDrop{
    0%  {transform:none;opacity:1}
    18% {transform:scale(1.18) rotate(-10deg)}
    100%{transform:translate(10px,28px) rotate(18deg) scale(.55);opacity:0}
  }

  .scene.is-active .rise{animation:rise .8s cubic-bezier(.2,.85,.2,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}

  .scene.is-active .pop{animation:pop .55s cubic-bezier(.2,1.35,.35,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes pop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}

  .scene.is-active .inL{animation:inL .9s cubic-bezier(.2,.85,.2,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes inL{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}

  .scene.is-active .inR{animation:inR .9s cubic-bezier(.2,.85,.2,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes inR{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}

  .pop,.wheel,.pulse,.wobble,.zip-tie,.lever,.thumb-press,.jar-fly,.star-drop,.fill-up,.lid-drop{transform-box:fill-box;transform-origin:center}
  /*photos*/
  /* Real warehouse photos pinned into the illustrated scene. They ride
     the same .pop entrance and camera as everything else; tapping one
     opens it full-size so it is legible on a phone's letterboxed film. */
  .photo{cursor:pointer}
  .photo .photo-frame{stroke:#DCE6D8;stroke-width:1.5}
  .photo:hover .photo-frame{stroke:#4C9A72;stroke-width:2.5}
  .photobox{
    position:absolute;inset:0;z-index:6;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    background:rgba(21,40,31,.94);
    cursor:zoom-out;
    animation:photoboxIn .22s ease both;
  }
  .photobox[hidden]{display:none}
  @keyframes photoboxIn{from{opacity:0}to{opacity:1}}
  .photobox img{
    display:block;
    max-width:min(92%, 560px);
    max-height:min(74%, 74dvh);
    width:auto;height:auto;
    border-radius:14px;
    box-shadow:0 30px 70px rgba(0,0,0,.5);
    background:#FBFAF6;
    padding:6px;
    box-sizing:border-box;
  }
  .photobox-cap{
    margin:0;
    font-family:var(--font-display);
    font-size:max(13px, 1.1cqw);letter-spacing:.16em;font-weight:800;
    color:#8FC3A3;text-align:center;
  }
  .photobox-hint{
    margin:0;
    font-size:max(12px, .9cqw);font-weight:600;
    color:rgba(244,241,232,.7);text-align:center;
  }
  .photobox-close{
    position:absolute;top:max(12px, env(safe-area-inset-top));right:14px;
    width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(143,195,163,.5);
    background:rgba(27,59,44,.8);color:#F4F1E8;
    font-size:26px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  /*/photos*/
  .fill-up,.lid-drop{transform-origin:50% 100%}
  .glance{transform-box:fill-box;transform-origin:50% 100%}

  /* Intra-scene shot changes are cuts, not dissolves. */
  .scene.is-active .ph{
    animation:phIn .28s ease calc(var(--in,0s) * var(--pace,1)) both,
              phOut .22s ease calc(var(--out,9999s) * var(--pace,1)) forwards;
  }
  @keyframes phIn{from{opacity:0;transform:scale(1.035)}to{opacity:1;transform:none}}
  @keyframes phOut{from{opacity:1}to{opacity:0}}

  /* walking, doors, wheels, misc */
  .scene.is-active .walk{animation:walk 1.9s cubic-bezier(.25,.7,.3,1) calc(var(--d,.2s) * var(--pace,1)) both}
  @keyframes walk{from{transform:translateX(-460px)}to{transform:translateX(0)}}

  .scene.is-active .bob{animation:bob .52s ease-in-out calc(var(--d,.2s) * var(--pace,1)) 4}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  .scene.is-active .door{animation:door 1.4s cubic-bezier(.4,.05,.2,1) calc(.55s * var(--pace,1)) both}
  @keyframes door{from{transform:translateY(0)}to{transform:translateY(-396px)}}

  .scene.is-active .rackroll{animation:rackroll 1.9s cubic-bezier(.2,.8,.25,1) calc(.25s * var(--pace,1)) both}
  @keyframes rackroll{from{transform:translateX(790px)}to{transform:translateX(0)}}

  /* Three turns covers the drive-in and then the wheels stop with the
     car, instead of spinning on forever while it sits parked. */
  .scene.is-active .wheel{animation:spin 1.1s linear calc(var(--d,0s) * var(--pace,1)) 3}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* suspension dipping as the car comes to rest */
  .scene.is-active .settle{animation:settle 1s cubic-bezier(.3,1.4,.4,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes settle{
    0%  {transform:translateY(0)}
    28% {transform:translateY(6px)}
    58% {transform:translateY(-3px)}
    100%{transform:translateY(0)}
  }

  .scene.is-active .drive{animation:drive 2.5s cubic-bezier(.15,.75,.25,1) calc(.3s * var(--pace,1)) both}
  @keyframes drive{from{transform:translateX(-620px)}to{transform:translateX(0)}}

  .scene.is-active .dashmove{animation:dashmove .55s linear infinite}
  @keyframes dashmove{to{transform:translateX(-170px)}}

  .scene.is-active .pulse{animation:pulse 1.7s ease-in-out calc(var(--d,0s) * var(--pace,1)) infinite}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.045)}}

  .scene.is-active .wobble{animation:wobble 1.5s ease-in-out calc(var(--d,0s) * var(--pace,1)) infinite}
  @keyframes wobble{
    0%,100%{transform:translateX(0) rotate(0deg)}
    30%{transform:translateX(11px) rotate(2.6deg)}
    65%{transform:translateX(-8px) rotate(-2deg)}
  }

  .scene.is-active .scan{animation:scan 3s cubic-bezier(.4,0,.5,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes scan{
    0%{transform:translateX(0);opacity:0}
    12%{opacity:1}
    38%{transform:translateX(324px)}
    64%{transform:translateX(162px)}
    88%,100%{transform:translateX(0);opacity:0}
  }

  .flash{opacity:0;pointer-events:none}
  .scene.is-active .flash{animation:flash .85s ease-out calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes flash{0%{opacity:0}14%{opacity:.92}100%{opacity:0}}

  .scene.is-active .thumb-press{animation:thumbPress 1.45s cubic-bezier(.3,.8,.3,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes thumbPress{
    from{transform:translate(36px,-68px);opacity:0}
    22%{transform:translate(0,0);opacity:1}
    48%{transform:translate(0,12px);opacity:1}
    72%{transform:translate(0,12px);opacity:1}
    to{transform:translate(28px,-56px);opacity:0}
  }
  .scene.is-active .lever{animation:leverPress .55s cubic-bezier(.4,.1,.2,1) calc(var(--d,0s) * var(--pace,1)) both;transform-origin:12px 8px}
  @keyframes leverPress{
    0%,28%{transform:rotate(-8deg)}
    55%,100%{transform:rotate(32deg)}
  }
  .scene.is-active .zip-tie{animation:zipRelease 1.15s cubic-bezier(.3,1.1,.4,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes zipRelease{
    0%,38%{transform:none;opacity:1}
    58%{transform:translate(48px,4px)}
    to{transform:translate(86px,-64px) rotate(16deg);opacity:0}
  }

  .scene.is-active .jar-fly{animation:jarFly 1.15s cubic-bezier(.4,-.3,.4,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes jarFly{
    0%{transform:translate(0,0) rotate(0deg);opacity:1}
    100%{transform:translate(var(--fx,300px),var(--fy,-120px)) rotate(28deg);opacity:0}
  }

  .scene.is-active .handoff{animation:handoff 1.5s cubic-bezier(.3,.8,.3,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes handoff{from{transform:translateX(0)}to{transform:translateX(126px)}}

  .scene.is-active .glance{animation:glance 7.4s ease-in-out calc(var(--d,0s) * var(--pace,1)) infinite}
  @keyframes glance{
    0%,38%,100%{transform:rotate(0deg)}
    46%{transform:rotate(-5deg)}
    68%{transform:rotate(-5deg)}
    76%{transform:rotate(0deg)}
  }

  .scene.is-active .bagload{animation:bagload .7s cubic-bezier(.2,.8,.25,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes bagload{from{transform:translate(160px,36px);opacity:0}to{transform:none;opacity:1}}

  .scene.is-active .ding{animation:ding .95s ease-out calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes ding{
    0%{transform:scale(.3);opacity:0}
    32%{transform:scale(1.18);opacity:1}
    100%{transform:scale(1);opacity:.28}
  }

  .scene.is-active .place{animation:place .75s cubic-bezier(.3,.85,.3,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes place{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}

  .scene.is-active .fill-up{animation:fillUp .95s cubic-bezier(.2,.85,.2,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes fillUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}

  .scene.is-active .lid-drop{animation:lidDrop .6s cubic-bezier(.3,1.35,.4,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes lidDrop{
    from{transform:translateY(-40px) rotate(-10deg);opacity:0}
    68%{transform:translateY(4px) rotate(2deg);opacity:1}
    to{transform:none;opacity:1}
  }

  /* =================================================================
     CAMERA — the single biggest difference between a video and a deck.
     Every scene sits inside a .cam group that keeps moving for the
     scene's whole length, so no frame is ever completely still. The
     duration comes from JS (--camdur) so a camera move always lasts
     exactly as long as the narration clip under it.

     Every move stays at scale >= 1.03 and pans <= 20px, which keeps
     roughly 24px of overscan on all sides so a pan can never expose
     the edge of a full-bleed background.
     ================================================================= */
  .cam{
    transform-origin:var(--cox,50%) var(--coy,50%);
    will-change:transform;
  }
  .scene.is-active .cam{
    animation:var(--cam,camDrift) var(--camdur,10s) cubic-bezier(.22,.12,.28,1) both;
  }
  @keyframes camDrift{
    from{transform:scale(1.035) translate(6px,4px)}
    to  {transform:scale(1.085) translate(-8px,-6px)}
  }
  @keyframes camPushIn{
    from{transform:scale(1.03)}
    to  {transform:scale(1.105)}
  }
  @keyframes camPullOut{
    from{transform:scale(1.105)}
    to  {transform:scale(1.03)}
  }
  @keyframes camPanL{            /* subject drifts left: camera tracks right */
    from{transform:scale(1.06) translateX(19px)}
    to  {transform:scale(1.06) translateX(-19px)}
  }
  @keyframes camPanR{
    from{transform:scale(1.06) translateX(-19px)}
    to  {transform:scale(1.06) translateX(19px)}
  }
  @keyframes camCrane{           /* slow rise while pushing in */
    from{transform:scale(1.035) translateY(17px)}
    to  {transform:scale(1.095) translateY(-13px)}
  }

  /* Parallax: a layer inside .cam that drifts against the camera adds
     the depth cue a flat pan can't give on its own. */
  .scene.is-active .plx{animation:plx var(--camdur,10s) linear both}
  @keyframes plx{
    from{transform:translateX(calc(var(--plx,10px) * -1))}
    to  {transform:translateX(var(--plx,10px))}
  }

  /* =================================================================
     IDLE LIFE — characters were previously frozen statues for the
     entire scene. These loops never end, so they fill the long tail
     of a scene after the entrance beats have landed.
     ================================================================= */
  .breathe,.breathe-s,.sway,.sway-s,.flutter,.eye,.float,.shaft,.shimmer{
    transform-box:fill-box;
  }
  .breathe,.breathe-s{transform-origin:50% 100%}   /* feet stay planted */
  .sway,.sway-s{transform-origin:50% 0%}           /* hangs from the handle */
  .flutter{transform-origin:0% 50%}
  .eye{transform-origin:50% 50%}

  .scene.is-active .breathe{animation:breathe 4.1s ease-in-out var(--d,0s) infinite}
  .scene.is-active .breathe-s{animation:breathe 3.4s ease-in-out var(--d,.7s) infinite}
  @keyframes breathe{
    0%,100%{transform:scaleY(1) translateY(0)}
    45%    {transform:scaleY(1.013) translateY(-1.5px)}
  }

  .scene.is-active .sway{animation:sway 3.6s ease-in-out var(--d,0s) infinite}
  .scene.is-active .sway-s{animation:sway 2.9s ease-in-out var(--d,.4s) infinite}
  @keyframes sway{
    0%,100%{transform:rotate(-.9deg)}
    50%    {transform:rotate(.9deg)}
  }

  .scene.is-active .flutter{animation:flutter 2.7s ease-in-out var(--d,0s) infinite}
  @keyframes flutter{
    0%,100%{transform:rotate(0deg)}
    50%    {transform:rotate(1.6deg)}
  }

  /* Blinks live on the character definitions, so they are deliberately
     not scoped to .is-active — the defs are outside every scene. */
  .eye{animation:blink 5.6s steps(1,end) infinite}
  #dispatch .eye{animation-duration:7.3s;animation-delay:1.1s}
  #customer .eye{animation-duration:6.4s;animation-delay:2.4s}
  @keyframes blink{
    0%,96%   {transform:scaleY(1)}
    97%,98.4%{transform:scaleY(.08)}
    99%,100% {transform:scaleY(1)}
  }

  /* Dust in a sunbeam, and the sunbeam itself. */
  .scene.is-active .float{animation:float var(--fd,9s) ease-in-out var(--d,0s) infinite}
  @keyframes float{
    0%  {transform:translate(0,0);opacity:0}
    18% {opacity:.75}
    50% {transform:translate(var(--fx,26px),-46px)}
    82% {opacity:.55}
    100%{transform:translate(calc(var(--fx,26px) * 1.7),-96px);opacity:0}
  }

  .scene.is-active .shaft{animation:shaft 11s ease-in-out var(--d,0s) infinite}
  @keyframes shaft{
    0%,100%{transform:translateX(0) scaleX(1);opacity:.5}
    50%    {transform:translateX(16px) scaleX(1.05);opacity:.78}
  }

  .scene.is-active .shimmer{animation:shimmer 4.6s ease-in-out var(--d,0s) infinite}
  @keyframes shimmer{
    0%,100%{opacity:.5}
    50%    {opacity:.95}
  }

  /* Screen-glow on the phone / a highlight that reads as backlight. */
  .scene.is-active .glow{animation:glow 2.8s ease-in-out var(--d,0s) infinite}
  @keyframes glow{
    0%,100%{opacity:.28}
    50%    {opacity:.62}
  }

  /* Leader lines and underlines draw themselves on instead of fading in.
     The element needs stroke-dasharray:var(--len) to match. */
  .scene.is-active .draw{animation:draw 1.15s cubic-bezier(.3,.75,.3,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes draw{
    from{stroke-dashoffset:var(--len,600)}
    to  {stroke-dashoffset:0}
  }

  /* A fast object gets a smeared double behind it — cheap motion blur. */
  .scene.is-active .smear{animation:smear 1.9s cubic-bezier(.2,.8,.25,1) calc(var(--d,0s) * var(--pace,1)) both}
  @keyframes smear{
    0%  {opacity:.42}
    55% {opacity:.17}
    100%{opacity:0}
  }

  /* =================================================================
     FILM GRAIN + VIGNETTE — the two cheapest cues that read as
     "footage" rather than "graphics".
     ================================================================= */
  .grain{
    mix-blend-mode:overlay;opacity:.055;pointer-events:none;
    animation:grain .8s steps(1,end) infinite;
    transform-box:view-box;
  }
  @keyframes grain{
    0%  {transform:translate(0,0)}
    20% {transform:translate(-38px,26px)}
    40% {transform:translate(31px,-19px)}
    60% {transform:translate(-24px,-33px)}
    80% {transform:translate(42px,17px)}
    100%{transform:translate(-15px,35px)}
  }
  .vignette{
    position:absolute;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(120% 105% at 50% 46%,
      rgba(0,0,0,0) 52%, rgba(20,32,24,.13) 82%, rgba(14,24,18,.3) 100%);
  }

  .stage.is-paused .canvas,
  .stage.is-paused .canvas *{animation-play-state:paused!important}

  @media (prefers-reduced-motion:reduce){
    .scene.is-active *{animation-duration:.01ms!important;animation-iteration-count:1!important}
  }

  /* Phones cannot composite feTurbulence grain + a handheld transform
     over a full 1600×900 SVG. Story beats stay; the film-stock pass goes. */
  @media (hover:none), (pointer:coarse), (max-width:900px){
    .canvas{animation:none}
    .grain{display:none}
    .cam{will-change:auto}
    .canvas [filter]{filter:none}
    .scene.is-active .float,
    .scene.is-active .shaft,
    .scene.is-active .shimmer,
    .scene.is-active .glow,
    .scene.is-active .dashmove,
    .eye{animation:none}
    /* Dissolve between complete frames. Entrance beats start from
       opacity 0 / off-canvas, so playing them during the fade makes
       the incoming shot look empty, then pop. */
    .scene{
      transform:none;
      transition:opacity .7s ease, visibility .7s ease;
    }
    .scene.is-leaving{
      opacity:0;
      visibility:hidden;
      transform:none;
    }
    .scene.is-active{
      animation:sceneFadeIn .7s linear both;
      transform:none;
    }
    .scene.is-warm{
      display:inline;
      opacity:0;
      visibility:visible;
      transform:none;
    }
    .scene.is-active.is-leaving{
      animation:sceneFadeOut .7s linear both;
      visibility:visible;
      transform:none;
    }
    .scene.is-active .cam{
      animation:none;
      transform:scale(1.05);
    }
    .scene.is-active *:not(.cam):not(.breathe):not(.breathe-s):not(.sway):not(.sway-s):not(.flutter):not(.ph):not(.flash){
      animation:none!important;
    }
    .cutflash{display:none}
  }

  /* ---------- Phone / tablet: keep the film 16:9, make chrome usable ---------- */
  @media (max-width:1100px){
    button{touch-action:manipulation}
    .btn{
      min-height:44px;
      font-size:max(12px,1.02cqw);
      letter-spacing:.08em;
      padding:max(8px,1cqh) max(12px,1.5cqw);
    }
    .btn svg{width:16px;height:16px;flex:0 0 auto}
    .caption{font-size:max(15px,1.95cqw)}
    .step{font-size:max(11px,.92cqw);letter-spacing:.14em}
    .dot{width:11px;height:11px;margin:0 5px}
    .lang-btn{
      font-size:max(15px,1.45cqw);
      min-width:132px;
      min-height:48px;
      letter-spacing:.06em;
    }
    .capbar{padding-right:max(28cqw, 11rem)}
  }

  @media (max-width:900px) and (orientation:portrait){
    html,body{width:100%;max-width:100%;overflow:hidden}
    body{display:block;padding:0}
    .stage{
      width:100%;
      height:100%;
      height:100dvh;
      aspect-ratio:auto;
      display:block;
      box-shadow:none;
      background:var(--bg);
      container-type:size;
      overflow:hidden;
    }
    .screen{
      position:absolute;
      inset:0;
      width:auto;
      height:auto;
      max-height:none;
      aspect-ratio:auto;
      margin:0;
      flex:none;
      background:var(--bg);
      overflow:hidden;
    }
    .canvas,.vignette,.cutflash,.filmbar{
      position:absolute;inset:0;width:100%;height:100%;
    }
    .controls{
      top:max(10px, env(safe-area-inset-top, 0px));
      right:10px;
      gap:8px;
    }
    .dots{
      position:absolute;
      left:0;right:0;bottom:calc(132px + env(safe-area-inset-bottom, 0px));
      padding:0;
      gap:0;
      opacity:1;
    }
    .stage.is-idle .dots{opacity:1}
    .capbar{
      position:absolute;
      left:0;right:0;bottom:0;
      flex:none;
      min-height:0;
      transform:none;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      justify-content:flex-end;
      gap:6px;
      padding:56px 16px calc(72px + env(safe-area-inset-bottom, 0px)) 16px;
      background:linear-gradient(180deg,rgba(27,59,44,0) 0%,rgba(21,40,31,.88) 52%,#15281F 100%);
      overflow:visible;
    }
    .capbar.is-hidden{
      transform:none;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      flex:none;
      min-height:0;
      padding:56px 16px calc(72px + env(safe-area-inset-bottom, 0px)) 16px;
      overflow:visible;
    }
    .step{padding:0;opacity:.85;font-size:11px}
    .caption{
      font-size:1.05rem;
      line-height:1.35;
      margin:0;
      max-width:100%;
      flex:none;
    }
    .nav{
      position:absolute;
      left:12px;right:12px;
      bottom:max(10px, env(safe-area-inset-bottom, 0px));
      width:auto;
      justify-content:stretch;
      gap:10px;
      padding:0;
      margin:0;
      background:transparent;
    }
    .nav .btn{flex:1 1 0;justify-content:center;min-height:44px;font-size:14px}
    .langpick{
      position:absolute;
      inset:auto 0 calc(68px + env(safe-area-inset-bottom, 0px)) 0;
      z-index:5;
      flex:none;
      align-items:flex-end;
      justify-content:center;
      padding:0 20px;
    }
    .langpick-row{
      flex-direction:column;
      width:min(100%, 280px);
      gap:12px;
    }
    .lang-btn{
      width:100%;
      max-width:none;
      flex:none;
      color:#F4F1E8;
      background:#2F6B4F;
      border-color:#8FC3A3;
      font-size:16px;
    }
    .stage.is-idle .controls{opacity:1}
  }

  @media (max-width:1100px) and (orientation:landscape){
    body{
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }
    .stage{box-shadow:none}
    .capbar{
      padding-left:max(16px, 3.2cqw);
      padding-bottom:max(10px, 1.6cqh);
      padding-right:max(11rem, 28cqw);
    }
    .nav{right:max(12px, 2cqw);bottom:max(10px, 2cqh)}
    .controls{top:max(8px, 2cqh);right:max(8px, 2cqw)}
  }
</style>

<script>
(function(){
  "use strict";
  const NS = "http://www.w3.org/2000/svg";

  /* Replaced by `python3 narration.py embed` with an inline base64 audio map. */
  /*__AUDIO_MANIFEST__*/

  /* ---------------------------------------------------------------
     THE ONE REUSABLE BAG LABEL COMPONENT
     Redrawn from the real printed label — see reference/bag-label-real.png.
     Bottom-left  = "route - stop", the only two numbers a driver acts on
     Top-right    = a box reading DSP, outlined in that week's colour
     Right card   = warehouse-facing: contents, route, internal bin, QR
     Rendered into every <g class="label-slot">, drawn in a 200x130 box
     so callers can place and scale it however they like.
     --------------------------------------------------------------- */
  const WEEK_COLORS = {
    violet:"#7C3AED",
    amber: "#E0A33E",
    teal:  "#3E8E9C",
    coral: "#D2694E"
  };

  /* A plausible-looking QR block. It encodes nothing — it just has to read
     as a QR code at a glance, which a real one would only complicate. */
  function qrMarkup(x, y, size){
    const N = 21, m = size / N;
    let seed = 20260903;
    function rnd(){
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      return seed / 0x7fffffff;
    }
    let out = '<rect x="'+x+'" y="'+y+'" width="'+size+'" height="'+size+'" fill="#FFFFFF"/>';

    for (let r = 0; r < N; r++){
      for (let c = 0; c < N; c++){
        const corner = (r < 8 && c < 8) || (r < 8 && c >= N-8) || (r >= N-8 && c < 8);
        if (corner || rnd() < 0.5) continue;
        out += '<rect x="'+(x+c*m).toFixed(2)+'" y="'+(y+r*m).toFixed(2)+
               '" width="'+(m*1.04).toFixed(2)+'" height="'+(m*1.04).toFixed(2)+'" fill="#111111"/>';
      }
    }
    [[0,0],[N-7,0],[0,N-7]].forEach(function(p){
      const fx = x + p[0]*m, fy = y + p[1]*m;
      out += '<rect x="'+fx.toFixed(2)+'" y="'+fy.toFixed(2)+'" width="'+(7*m).toFixed(2)+'" height="'+(7*m).toFixed(2)+'" fill="#111111"/>'
           + '<rect x="'+(fx+m).toFixed(2)+'" y="'+(fy+m).toFixed(2)+'" width="'+(5*m).toFixed(2)+'" height="'+(5*m).toFixed(2)+'" fill="#FFFFFF"/>'
           + '<rect x="'+(fx+2*m).toFixed(2)+'" y="'+(fy+2*m).toFixed(2)+'" width="'+(3*m).toFixed(2)+'" height="'+(3*m).toFixed(2)+'" fill="#111111"/>';
    });
    return out;
  }

  function labelMarkup(o){
    const wk = WEEK_COLORS[o.week] || WEEK_COLORS.violet;
    const dsp = o.dsp || "DSP";
    const dspW = Math.max(31, dsp.length * 5.5 + 10);
    const dspX = (193 - dspW).toFixed(1);
    const dspCx = (193 - dspW / 2).toFixed(1);
    return `
      <rect width="200" height="130" rx="6" fill="#FFFFFF" stroke="#E4E4E4" stroke-width="1.4"/>

      <text x="11" y="14" font-size="6.2" font-weight="800" fill="#111111">Order ID: ${o.order}</text>
      <text x="72" y="14" font-size="6.2" font-weight="500" fill="#3A3A3A">${o.date}</text>

      <rect x="${dspX}" y="5" width="${dspW.toFixed(1)}" height="15" rx="3" fill="#FFFFFF" stroke="${wk}" stroke-width="1.8"/>
      <text x="${dspCx}" y="15.7" font-size="7.6" font-weight="800" fill="${wk}" text-anchor="middle">${dsp}</text>

      <text x="11" y="35" font-size="14" font-weight="800" fill="#111111">${o.name}</text>
      <text x="11" y="46" font-size="6.2" font-weight="500" fill="#2E2E2E">${o.addr}</text>
      <text x="11" y="57" font-size="6.2" font-weight="500" fill="#2E2E2E"><tspan font-weight="800">Delivery Instructions:</tspan> ${o.notes}</text>

      <text x="11" y="95" font-size="15.5" font-weight="800" fill="#111111">${o.route} - ${o.stop}</text>
      <g font-size="4.3" font-weight="500" fill="#3A3A3A">
        <text x="11" y="104">We reuse packaging to reduce waste!</text>
        <text x="11" y="110">Leave jars, totes and ice packs</text>
        <text x="11" y="116">outside before your next delivery</text>
        <text x="11" y="122">and we'll take them back :)</text>
      </g>

      <rect x="112" y="23" width="81" height="101" rx="7" fill="#FFFFFF" stroke="#DEDEDE" stroke-width="1.2"/>
      <text x="152.5" y="33" font-size="4.8" font-weight="500" fill="#222222" text-anchor="middle">${o.contents}</text>
      <text x="152.5" y="57" font-size="23" font-weight="800" fill="#111111" text-anchor="middle">${o.route}</text>
      <text x="152.5" y="70" font-size="9.5" font-weight="800" fill="#111111" text-anchor="middle">Bin: ${o.bin}</text>
      ${qrMarkup(139, 75, 27)}
      <text x="152.5" y="107" font-size="3.1" font-weight="500" fill="#8A8A8A" text-anchor="middle">Scan for order details</text>
      <text x="118" y="119" font-size="6" font-weight="800" fill="#111111">${o.jars} jars</text>
      <text x="187" y="119" font-size="6" font-weight="800" fill="#111111" text-anchor="end">${o.sides} sides</text>`;
  }

  document.querySelectorAll(".label-slot").forEach(function(slot){
    const d = slot.dataset;
    slot.innerHTML = labelMarkup({
      week:     d.week,
      dsp:      d.dsp      || "DSP",
      order:    d.order    || "100001",
      date:     d.date     || "9/3/2026",
      name:     d.name     || "John Doe",
      addr:     d.addr     || "1234 San Francisco, CA 94109",
      notes:    d.notes    || "none",
      route:    d.route,
      stop:     d.stop,
      bin:      d.bin      || d.stop,
      contents: d.contents || "1 TOTE, 3 large ice",
      jars:     d.jars     || "4",
      sides:    d.sides    || "2"
    });
  });

  /* ---------------------------------------------------------------
     Rolling rack plus the staggered verification checkmarks
     used in the rack-check scene. Occupancy varies by shelf so the rack reads
     as "this order," not a counted bag total.
     --------------------------------------------------------------- */
  const SHELVES = [120, 232, 344, 456];
  const COLS = [14, 96, 178, 260, 342];
  const BAGS_ON_SHELF = [4, 5, 3, 4];
  const BAG_SCALE = 0.6;
  const CHECK_START = 2.6;
  const CHECK_STEP = 0.2;

  function el(name, attrs){
    const node = document.createElementNS(NS, name);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  }

  function buildRack(slot){
    const withChecks = slot.dataset.checks === "1";
    const frag = document.createDocumentFragment();

    // frame
    frag.appendChild(el("rect", {x:0, y:46, width:430, height:11, rx:5.5, fill:"#2F6B4F"}));
    frag.appendChild(el("rect", {x:0, y:56, width:13, height:424, rx:6, fill:"#2F6B4F"}));
    frag.appendChild(el("rect", {x:417, y:56, width:13, height:424, rx:6, fill:"#2F6B4F"}));

    // shelves + bags
    let n = 0;
    SHELVES.forEach(function(shelfY, row){
      const count = BAGS_ON_SHELF[row] || COLS.length;
      COLS.slice(0, count).forEach(function(x){
        const g = el("g", {transform:"translate(" + x + "," + (shelfY - 86 * BAG_SCALE) + ")"});
        g.appendChild(el("use", {href:"#bag", transform:"scale(" + BAG_SCALE + ")"}));
        frag.appendChild(g);
        n++;
      });
      frag.appendChild(el("rect", {x:0, y:shelfY, width:430, height:11, rx:4, fill:"#DCE6D8"}));
      frag.appendChild(el("rect", {x:0, y:shelfY + 11, width:430, height:4, fill:"#C2D2C4"}));
    });

    // casters
    [40, 150, 280, 390].forEach(function(cx){
      frag.appendChild(el("circle", {cx:cx, cy:492, r:12, fill:"#3A4A40"}));
      frag.appendChild(el("circle", {cx:cx, cy:492, r:5, fill:"#8FA593"}));
    });

    // verification checkmarks
    if (withChecks){
      let i = 0;
      SHELVES.forEach(function(shelfY, row){
        const count = BAGS_ON_SHELF[row] || COLS.length;
        COLS.slice(0, count).forEach(function(x){
          const cx = x + 74 * BAG_SCALE / 2;
          const cy = shelfY - 86 * BAG_SCALE / 2;
          // Position on an outer <g>; the animated <g> must stay free of a
          // transform attribute, or the CSS scale would wipe out the offset.
          const holder = el("g", {transform:"translate(" + cx + "," + cy + ")"});
          const g = el("g", {
            class:"pop",
            style:"--d:" + (CHECK_START + i * CHECK_STEP).toFixed(2) + "s"
          });
          g.appendChild(el("circle", {r:16, fill:"#4C9A72", stroke:"#FBFAF6", "stroke-width":3}));
          g.appendChild(el("path", {
            d:"M-7,0 l5,6 l9,-11",
            stroke:"#FBFAF6", "stroke-width":3.6, fill:"none",
            "stroke-linecap":"round", "stroke-linejoin":"round"
          }));
          holder.appendChild(g);
          frag.appendChild(holder);
          i++;
        });
      });
    }
    slot.appendChild(frag);
  }

  document.querySelectorAll(".rack-slot").forEach(buildRack);

  /* ---------------------------------------------------------------
     Scene timeline

  const TAIL_MS = 0;                // unlock Continue as soon as the line ends
  const AUDIO_REV = "ugbbys2-es-1";  // bump when re-recording so the browser drops stale clips
  const MANIFEST = (typeof window.__AUDIO__ === "object" && window.__AUDIO__) || null;
  const clips = {};
  const clipSecs = {};

  function clipSrc(id){
    const code = lang || "en";
    if (MANIFEST){
      if (MANIFEST[code] && MANIFEST[code][id]) return MANIFEST[code][id];
      if (code === "en" && MANIFEST[id]) return MANIFEST[id];
      return "";

  function attachClip(id, src){
    if (clips[id]) return clips[id];
    const audio = new Audio();
    audio.preload = LITE ? "metadata" : "auto";
    audio.setAttribute("playsinline", "");
    audio.setAttribute("data-vo", id);
    audio.style.display = "none";
    document.body.appendChild(audio);
    audio.addEventListener("loadedmetadata", function(){
      if (isFinite(audio.duration) && audio.duration > 0){
        clipSecs[id] = audio.duration;
        hasAudio = true;

  function loadAudio(done){
    /* A live-reload can re-run this script without tearing down the old
       <audio> nodes, which leaves the previous voice playing under the new one. */
    const gen = ++loadGen;
    document.querySelectorAll("audio[data-vo]").forEach(function(el){
      el.pause();
      el.removeAttribute("src");
      el.remove();
    });
    Object.keys(clips).forEach(function(id){ delete clips[id]; });
    Object.keys(clipSecs).forEach(function(id){ delete clipSecs[id]; });
    hasAudio = false;

    /* Phones: don't open 15 network requests before the first scene.
       speak() creates the current clip and prefetches the next one. */
    if (LITE){
      if (gen === loadGen) done(0);
      return;
    }

    let pending = 0, found = 0, settled = false;

    function finish(){
      if (settled || gen !== loadGen) return;
      settled = true;
      done(found);
    }

    SCENES.forEach(function(s){
      const src = clipSrc(s.id);
      if (!src) return;
      pending++;
      const audio = attachClip(s.id, src);
      audio.addEventListener("loadedmetadata", function(){
        if (gen !== loadGen) return;
        if (isFinite(audio.duration) && audio.duration > 0) found++;
        if (--pending === 0) finish();
      });
      audio.addEventListener("error", function(){
        if (gen !== loadGen) return;
        if (--pending === 0) finish();
      });
    });

    hasAudio = Object.keys(clips).length > 0;
    if (pending === 0) finish();
    setTimeout(finish, 5000);       // never hang on a stalled request

    playing = on;
    stage.classList.toggle("is-paused", !on);
    playIcon.setAttribute("d", on ? ICON_PAUSE : ICON_PLAY);
    playLabel.textContent = on ? t("pause") : t("play");

    const voice = clips[SCENES[index].id];

    if (on){
      startedAt = performance.now();
      clearTimeout(timer);
      timer = setTimeout(sceneFinished, remaining);
      if (SCENES[index].id === "s3") runCounter(durationFor(index) / SCENES[index].dur);
      if (voice) voice.play().catch(function(){});
      paintProgress();
    } else {
      clearTimeout(timer);
      remaining = Math.max(0, remaining - (performance.now() - startedAt));
      if (voice) voice.pause();
      if (progRaf){ cancelAnimationFrame(progRaf); progRaf = null; }
      paintProgress();
    }
  }

  playBtn.addEventListener("click", function(){ setPlaying(!playing); });
  replayBtn.addEventListener("click", function(){ show(index); });
  backBtn.addEventListener("click", back);
  contBtn.addEventListener("click", function(){
    if (picking){ startShow(); return; }
    next();
  });
  /*photos*/
  /* Tap a pinned photo to see it full-size. Scenes never auto-advance,
     so the show simply waits underneath until the viewer closes it. */
  const photobox = document.getElementById("photobox");
  if (photobox){
    const pbImg = document.getElementById("photoboxImg");
    const pbCap = document.getElementById("photoboxCap");
    function openPhoto(g){
      const img = g.querySelector("image");
      const capEl = g.querySelector("[data-i18n]");
      if (!img) return;
      pbImg.src = img.getAttribute("href");
      pbCap.textContent = capEl ? capEl.textContent : "";
      pbImg.alt = pbCap.textContent;
      photobox.hidden = false;
    }
    function closePhoto(){
      photobox.hidden = true;
      pbImg.removeAttribute("src");
    }
    document.querySelectorAll(".photo").forEach(function(g){
      g.setAttribute("role", "button");
      g.setAttribute("tabindex", "0");
      g.addEventListener("click", function(e){ e.stopPropagation(); openPhoto(g); });
      g.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " "){ e.preventDefault(); e.stopPropagation(); openPhoto(g); }
      });
    });
    photobox.addEventListener("click", closePhoto);
    document.addEventListener("keydown", function(e){
      if (!photobox.hidden && e.key === "Escape"){ e.stopPropagation(); closePhoto(); }
    }, true);
  }
  /*/photos*/

  document.addEventListener("keydown", function(e){
    if (picking){
      if ((e.code === "Space" || e.key === "Enter") && lang){ e.preventDefault(); startShow(); }
      return;
    }
    if (e.code === "Space"){ e.preventDefault(); setPlaying(!playing); }
    else if (e.key === "ArrowRight" || e.key === "Enter"){ e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); back(); }
    else if (e.key.toLowerCase() === "r") show(index);
  });

  // Hide the chrome while it plays so screen recordings stay clean.
  let idleTimer = null;
  const finePointer = window.matchMedia("(hover:hover) and (pointer:fine)");
  function wake(){
    stage.classList.remove("is-idle");
    clearTimeout(idleTimer);
    if (!finePointer.matches) return;
    idleTimer = setTimeout(function(){ stage.classList.add("is-idle"); }, 2600);
  }
  stage.addEventListener("mousemove", wake);
  stage.addEventListener("touchstart", wake, {passive:true});
  stage.addEventListener("pointerdown", wake);
  wake();

  function chooseLang(next){
    lang = next;
    unlockAudio();
    document.querySelectorAll(".lang-btn").forEach(function(btn){
      btn.classList.toggle("is-on", btn.getAttribute("data-lang") === next);
    });
    applyLang();
    if (audioLang !== next){
      audioReady = false;
      loadAudio(function(found){
        if (lang !== next) return;
        audioLang = next;
        audioReady = true;
        hasAudio = found > 0;
      });
    }
  }

  function enterLang(){
    picking = true;
    stage.classList.add("is-picking");
    langpick.classList.remove("is-gone");
    silence();
    clearTimeout(timer);
    if (progRaf){ cancelAnimationFrame(progRaf); progRaf = null; }
    SCENES.forEach(function(s, idx){
      const el = document.getElementById(s.id);
      el.classList.remove("is-active", "is-leaving");
      if (LITE && idx === 0) el.classList.add("is-warm");
      else el.classList.remove("is-warm");
    });
    slangEl.classList.remove("is-leaving");
    slangEl.classList.add("is-active");
    sceneDone = false;
    paintNav();
  }

  function startShow(){
    if (!picking || !lang) return;
    function go(){
      picking = false;
      stage.classList.remove("is-picking");
      langpick.classList.add("is-gone");
      slangEl.classList.remove("is-active");
      slangEl.classList.add("is-leaving");
      setTimeout(function(){ slangEl.classList.remove("is-leaving"); }, 400);
      unlockAudio();
      playing = true;
      show(0);
    }
    if (audioLang === lang && audioReady){
      go();
      return;
    }
    loadAudio(function(found){
      audioLang = lang;
      audioReady = true;
      hasAudio = found > 0;
      go();
    });
  }

  document.querySelectorAll(".lang-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      chooseLang(btn.getAttribute("data-lang"));
    });
  });

  paintNav();

  loadAudio(function(found){
    audioLang = "en";
    audioReady = true;
    if (found > 0) hasAudio = true;
  });
})();
</script>
</body>
</html>
